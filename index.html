<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pngpro — Free JPG to PNG Converter | Studio Quality</title>
    <meta name="description" content="Convert JPG to PNG online for free. Studio quality, no watermark, no sign-in. Files never leave your device — 100% private, 100% free." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
      :root { font-family: 'Inter', system-ui, sans-serif; }
      body { font-family: 'Inter', system-ui, sans-serif; }
      .gradient-text {
        background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .gradient-btn {
        background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        transition: all 0.25s ease;
      }
      .gradient-btn:hover {
        background: linear-gradient(135deg, #1d4ed8 0%, #6d28d9 100%);
        box-shadow: 0 10px 30px rgba(124, 58, 237, 0.35);
        transform: translateY(-1px);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
      .drop-zone {
        transition: all 0.25s ease;
      }
      .drop-zone.dragover {
        border-color: #7c3aed;
        background: rgba(124, 58, 237, 0.05);
        transform: scale(1.01);
      }
      .fade-in { animation: fadeIn 0.4s ease; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .spin { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .faq-item[open] .faq-chevron { transform: rotate(180deg); }
      .faq-chevron { transition: transform 0.2s ease; }
    </style>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body class="bg-slate-50 text-slate-800 antialiased">
    <div id="app"></div>

    <script type="module">
      const app = document.getElementById('app');

      app.innerHTML = `
        <!-- Header -->
        <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200">
          <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between flex-wrap gap-3">
            <div class="flex items-center gap-2">
              <div class="w-9 h-9 rounded-xl gradient-btn flex items-center justify-center text-white font-extrabold text-lg shadow-lg">p</div>
              <span class="text-2xl font-extrabold tracking-tight">pngpro</span>
            </div>
            <div class="flex items-center gap-2 flex-wrap text-xs font-semibold text-slate-600">
              <span class="px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200">No Sign-in</span>
              <span class="px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200">No Watermark</span>
              <span class="px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200">No Subscription</span>
              <span class="px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700">100% Free</span>
            </div>
          </div>
        </header>

        <!-- Top Ad -->
        <div class="max-w-6xl mx-auto px-5 mt-6">
          <div class="h-24 border-2 border-dashed border-slate-300 rounded-2xl flex items-center justify-center text-slate-400 font-semibold tracking-wide">AD SPACE</div>
        </div>

        <!-- Hero -->
        <section class="max-w-4xl mx-auto px-5 pt-12 pb-8 text-center">
          <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight leading-tight">
            Free JPG to PNG Converter — <span class="gradient-text">Studio Quality</span>
          </h1>
          <p class="mt-4 text-lg text-slate-500 font-medium">Files never leave your device. No watermark, no sign-in, no limits.</p>
        </section>

        <!-- Main: Converter Card -->
        <main class="max-w-5xl mx-auto px-5 pb-16">
          <div class="grid grid-cols-1 lg:grid-cols-[1fr_240px] gap-6">
            <!-- Converter -->
            <div class="glass-card rounded-[32px] shadow-2xl p-6 sm:p-8">
              <div id="dropZone" class="drop-zone border-2 border-dashed border-slate-300 rounded-3xl p-10 text-center cursor-pointer hover:border-violet-400">
                <input id="fileInput" type="file" accept="image/jpeg,image/jpg" multiple class="hidden" />
                <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-blue-500 to-violet-600 flex items-center justify-center text-white mb-4 shadow-lg">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.9 5 5 0 019.9-1A5.5 5.5 0 0118 16M12 12v9m0-9l-3 3m3-3l3 3"/></svg>
                </div>
                <p class="text-lg font-bold text-slate-700">Drop JPG files here or click to upload</p>
                <p class="text-sm text-slate-400 mt-1">Up to 20 images • Processed locally in your browser</p>
              </div>

              <div id="results" class="mt-6 space-y-3"></div>

              <div id="actions" class="mt-6 hidden flex-col sm:flex-row gap-3">
                <button id="downloadAllBtn" class="gradient-btn text-white font-bold px-6 py-3.5 rounded-2xl shadow-lg flex items-center justify-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
                  Download All (ZIP)
                </button>
                <button id="clearBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-6 py-3.5 rounded-2xl transition">Clear All</button>
              </div>
            </div>

            <!-- Sidebar Ad -->
            <div class="hidden lg:block">
              <div class="sticky top-24 h-96 border-2 border-dashed border-slate-300 rounded-2xl flex items-center justify-center text-slate-400 font-semibold tracking-wide">AD SPACE</div>
            </div>
          </div>
        </main>

        <!-- Bottom Ad -->
        <div class="max-w-6xl mx-auto px-5 pb-12">
          <div class="h-24 border-2 border-dashed border-slate-300 rounded-2xl flex items-center justify-center text-slate-400 font-semibold tracking-wide">AD SPACE</div>
        </div>

        <!-- SEO + FAQ -->
        <section class="max-w-3xl mx-auto px-5 pb-20">
          <h2 class="text-2xl font-extrabold mb-4">Why use pngpro?</h2>
          <p class="text-slate-500 leading-relaxed">
            pngpro is a free online JPG to PNG converter that runs entirely in your browser. Your images are never uploaded to a server, which means complete privacy and instant conversion. Whether you need transparent backgrounds, lossless quality, or just a different format, pngpro delivers studio-quality PNGs with zero watermarks and no sign-up required.
          </p>

          <h2 class="text-2xl font-extrabold mt-12 mb-4">Frequently Asked Questions</h2>
          <div class="space-y-3" id="faq"></div>

          <p class="mt-12 text-center text-sm text-slate-400">pngpro — Convert JPG to PNG free, fast, and private.</p>
        </section>

        <!-- Footer -->
        <footer class="border-t border-slate-200 bg-white">
          <div class="max-w-6xl mx-auto px-5 py-8 text-center text-sm text-slate-400">
            <p>&copy; 2026 pngpro. All rights reserved. Built for speed and privacy.</p>
          </div>
        </footer>
      `;

      // FAQ data
      const faqs = [
        { q: "Is pngpro really free?", a: "Yes. pngpro is 100% free with no hidden costs, no subscription, and no watermark on your converted images." },
        { q: "Do my files get uploaded to a server?", a: "No. All conversion happens locally in your browser using HTML Canvas. Your files never leave your device, ensuring complete privacy." },
        { q: "How many images can I convert at once?", a: "You can convert up to 20 JPG images at once. Each is processed instantly and can be downloaded individually or all together as a ZIP file." },
        { q: "Will the PNG quality be the same as the JPG?", a: "PNG is a lossless format, so your converted image preserves all visual detail from the source JPG with no additional compression artifacts." },
      ];

      document.getElementById('faq').innerHTML = faqs.map((f, i) => `
        <details class="faq-item bg-white rounded-2xl border border-slate-200 group">
          <summary class="flex items-center justify-between px-5 py-4 cursor-pointer font-semibold text-slate-700 list-none">
            <span>${f.q}</span>
            <svg class="faq-chevron w-5 h-5 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </summary>
          <p class="px-5 pb-4 text-slate-500 leading-relaxed">${f.a}</p>
        </details>
      `).join('');

      // Converter logic
      const MAX_FILES = 20;
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');
      const results = document.getElementById('results');
      const actions = document.getElementById('actions');
      const downloadAllBtn = document.getElementById('downloadAllBtn');
      const clearBtn = document.getElementById('clearBtn');
      let converted = []; // { name, pngUrl, beforeKB, afterKB }

      const formatKB = (bytes) => (bytes / 1024).toFixed(1) + ' KB';

      dropZone.addEventListener('click', () => fileInput.click());

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
      });

      fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

      function handleFiles(fileList) {
        const files = Array.from(fileList).filter(f => /image\/jpe?g/i.test(f.type)).slice(0, MAX_FILES);
        if (files.length === 0) return;
        results.innerHTML = '';
        converted = [];
        files.forEach((file, idx) => convertFile(file, idx, files.length));
      }

      function convertFile(file, idx, total) {
        const id = `item-${idx}`;
        results.insertAdjacentHTML('beforeend', `
          <div id="${id}" class="fade-in flex items-center gap-4 p-4 rounded-2xl bg-white border border-slate-200">
            <div class="w-14 h-14 rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 shrink-0">
              <svg class="w-6 h-6 spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
            </div>
            <div class="flex-1 min-w-0">
              <p class="font-semibold text-slate-700 truncate">${file.name}</p>
              <p class="text-xs text-slate-400" data-size>${formatKB(file.size)} → converting…</p>
            </div>
          </div>
        `);

        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            canvas.toBlob((blob) => {
              if (!blob) return;
              const pngUrl = URL.createObjectURL(blob);
              const baseName = file.name.replace(/\.[^.]+$/, '');
              converted.push({ name: baseName + '.png', pngUrl, beforeKB: file.size, afterKB: blob.size });
              const item = document.getElementById(id);
              item.innerHTML = `
                <img src="${pngUrl}" class="w-14 h-14 rounded-xl object-cover border border-slate-200 shrink-0" alt="preview" />
                <div class="flex-1 min-w-0">
                  <p class="font-semibold text-slate-700 truncate">${baseName}.png</p>
                  <p class="text-xs text-slate-400">${formatKB(file.size)} → <span class="font-semibold text-emerald-600">${formatKB(blob.size)}</span></p>
                </div>
                <a href="${pngUrl}" download="${baseName}.png" class="gradient-btn text-white text-sm font-bold px-4 py-2.5 rounded-xl shadow shrink-0">Download</a>
              `;
              if (converted.length === total) {
                actions.classList.remove('hidden');
                actions.classList.add('flex');
              }
            }, 'image/png');
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      downloadAllBtn.addEventListener('click', async () => {
        if (converted.length === 0) return;
        const zip = new JSZip();
        for (const item of converted) {
          const res = await fetch(item.pngUrl);
          const buf = await res.arrayBuffer();
          zip.file(item.name, buf);
        }
        const content = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(content);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'pngpro-converted.zip';
        a.click();
        URL.revokeObjectURL(url);
      });

      clearBtn.addEventListener('click', () => {
        converted.forEach(c => URL.revokeObjectURL(c.pngUrl));
        converted = [];
        results.innerHTML = '';
        actions.classList.add('hidden');
        actions.classList.remove('flex');
        fileInput.value = '';
      });
    </script>
  </body>
</html>
